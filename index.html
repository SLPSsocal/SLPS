<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLPS Community Directory</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --saffron: #E8871A;
    --saffron-light: #F5A94B;
    --deep: #1A1410;
    --card-bg: #FDFAF6;
    --border: #E8DDD0;
    --muted: #8C7B6B;
    --active: #2A6B3C;
    --inactive: #9E9E9E;
    --life: #7B3FA0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #F5EFE6;
    font-family: 'DM Sans', sans-serif;
    color: var(--deep);
    min-height: 100vh;
  }

  header {
    background: var(--deep);
    padding: 28px 40px;
    display: flex;
    align-items: center;
    gap: 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 20px rgba(0,0,0,0.3);
  }

  .logo-mark {
    width: 48px;
    height: 48px;
    background: var(--saffron);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    color: white;
    font-size: 20px;
    flex-shrink: 0;
  }

  .header-text h1 {
    font-family: 'Playfair Display', serif;
    color: white;
    font-size: 22px;
    font-weight: 700;
    line-height: 1.1;
  }

  .header-text p {
    color: rgba(255,255,255,0.5);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .search-bar {
    margin-left: auto;
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .search-bar input {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    padding: 10px 16px;
    color: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    width: 260px;
    outline: none;
    transition: all 0.2s;
  }

  .search-bar input::placeholder { color: rgba(255,255,255,0.35); }
  .search-bar input:focus {
    border-color: var(--saffron);
    background: rgba(255,255,255,0.12);
  }

  select {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    padding: 10px 14px;
    color: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    outline: none;
    cursor: pointer;
    transition: all 0.2s;
  }

  select option { background: #2a2218; color: white; }
  select:focus { border-color: var(--saffron); }

  .stats-bar {
    background: white;
    border-bottom: 1px solid var(--border);
    padding: 12px 40px;
    display: flex;
    gap: 28px;
    align-items: center;
    font-size: 13px;
    color: var(--muted);
  }

  .stat { display: flex; gap: 6px; align-items: center; }
  .stat strong { color: var(--deep); font-weight: 500; }

  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    display: inline-block;
  }
  .dot-active { background: var(--active); }
  .dot-life { background: var(--life); }
  .dot-inactive { background: var(--inactive); }

  main {
    padding: 32px 40px;
    max-width: 1600px;
    margin: 0 auto;
  }

  #loading {
    text-align: center;
    padding: 80px 0;
    color: var(--muted);
    font-size: 15px;
  }

  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--saffron);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  #error-msg {
    display: none;
    background: #fff0f0;
    border: 1px solid #ffcccc;
    border-radius: 10px;
    padding: 20px 24px;
    margin: 40px 0;
    color: #c0392b;
    font-size: 14px;
    line-height: 1.6;
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
  }

  .card {
    background: var(--card-bg);
    border-radius: 16px;
    border: 1px solid var(--border);
    padding: 22px 24px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--border);
    transition: all 0.2s;
  }

  .card.status-active::before { background: var(--active); }
  .card.status-life::before { background: var(--life); }

  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    border-color: var(--saffron-light);
  }

  .card-header {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 14px;
  }

  .avatar {
    width: 46px; height: 46px;
    border-radius: 12px;
    background: var(--saffron);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    color: white;
    font-size: 18px;
    flex-shrink: 0;
  }

  .avatar.life-member { background: var(--life); }
  .avatar.inactive { background: #C5BAB0; }

  .card-name {
    flex: 1;
    min-width: 0;
  }

  .card-name h3 {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 16px;
    line-height: 1.2;
    color: var(--deep);
  }

  .card-name .spouse {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  .status-badge {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 20px;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .badge-active { background: #E8F5EC; color: var(--active); }
  .badge-life { background: #F3EAF9; color: var(--life); }
  .badge-inactive { background: #F2F2F2; color: var(--inactive); }
  .badge-voting { background: #EAF0F9; color: #2255A4; }

  .card-info {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 13px;
    color: var(--muted);
  }

  .info-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .info-row svg {
    width: 13px; height: 13px;
    flex-shrink: 0;
    opacity: 0.6;
  }

  .card-footer {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--muted);
  }

  .village-tag {
    background: rgba(232, 135, 26, 0.1);
    color: var(--saffron);
    padding: 3px 8px;
    border-radius: 6px;
    font-weight: 500;
    font-size: 11px;
  }

  .member-id {
    font-size: 10px;
    opacity: 0.5;
    font-family: monospace;
  }

  /* Modal */
  #modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(26,20,16,0.7);
    z-index: 200;
    backdrop-filter: blur(4px);
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  #modal-overlay.open { display: flex; }

  #modal {
    background: var(--card-bg);
    border-radius: 20px;
    max-width: 560px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    padding: 32px;
    position: relative;
  }

  #modal-close {
    position: absolute;
    top: 16px; right: 16px;
    background: var(--border);
    border: none;
    border-radius: 8px;
    width: 32px; height: 32px;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    transition: all 0.15s;
  }

  #modal-close:hover { background: var(--saffron); color: white; }

  .modal-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
    padding-right: 40px;
  }

  .modal-avatar {
    width: 64px; height: 64px;
    border-radius: 16px;
    background: var(--saffron);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    color: white;
    font-size: 26px;
    flex-shrink: 0;
  }

  .modal-avatar.life-member { background: var(--life); }
  .modal-avatar.inactive { background: #C5BAB0; }

  .modal-name h2 {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 700;
  }

  .modal-name .modal-spouse {
    font-size: 14px;
    color: var(--muted);
    margin-top: 4px;
  }

  .modal-section {
    margin-bottom: 20px;
  }

  .modal-section h4 {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--saffron);
    margin-bottom: 10px;
  }

  .detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .detail-item { }

  .detail-item label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    display: block;
    margin-bottom: 2px;
  }

  .detail-item span {
    font-size: 14px;
    color: var(--deep);
    font-weight: 400;
  }

  a { color: var(--saffron); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .no-results {
    text-align: center;
    padding: 60px 0;
    color: var(--muted);
    grid-column: 1 / -1;
  }

  .no-results p { font-size: 15px; margin-top: 8px; }
</style>
</head>
<body>

<header>
  <div class="logo-mark">S</div>
  <div class="header-text">
    <h1>Surti Leva Patidar Samaj</h1>
    <p>Southern California — Member Directory</p>
  </div>
  <div class="search-bar">
    <input type="text" id="search" placeholder="Search by name, city, village…" oninput="filterMembers()">
    <select id="status-filter" onchange="filterMembers()">
      <option value="">All Members</option>
      <option value="active">Active Only</option>
      <option value="life">Life Members</option>
      <option value="annual">Annual Dues</option>
      <option value="inactive">Non-Active</option>
    </select>
  </div>
</header>

<div class="stats-bar" id="stats-bar">
  <div class="stat"><span class="dot dot-active"></span><strong id="count-active">–</strong> Active</div>
  <div class="stat"><span class="dot dot-life"></span><strong id="count-life">–</strong> Life Members</div>
  <div class="stat"><span class="dot dot-inactive"></span><strong id="count-inactive">–</strong> Non-Active</div>
  <div class="stat" style="margin-left:auto;"><strong id="count-shown">–</strong> showing</div>
</div>

<main>
  <div id="loading">
    <div class="spinner"></div>
    Loading members…
  </div>
  <div id="error-msg"></div>
  <div id="grid"></div>
</main>

<!-- Detail Modal -->
<div id="modal-overlay" onclick="closeModal(event)">
  <div id="modal">
    <button id="modal-close" onclick="document.getElementById('modal-overlay').classList.remove('open')">✕</button>
    <div id="modal-content"></div>
  </div>
</div>

<script>
let allMembers = [];
let filtered = [];

async function loadMembers() {
  try {
    const res = await fetch('/.netlify/functions/members');
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
    const data = await res.json();
    const records = data.records || data;
    allMembers = records.map(parseRecord).filter(m => m.firstName);
    updateStats();
    filtered = [...allMembers];
    renderGrid(filtered);
    document.getElementById('loading').style.display = 'none';
  } catch(e) {
    document.getElementById('loading').style.display = 'none';
    const err = document.getElementById('error-msg');
    err.style.display = 'block';
    err.innerHTML = `<strong>Could not load members.</strong><br>${e.message}<br><br>
      <small>Check that the Netlify function is deployed and AIRTABLE_PAT is set.</small>`;
  }
}

function parseRecord(rec) {
  const f = rec.fields || {};
  return {
    id: rec.id,
    firstName: f.member_FirstName || '',
    lastName: f.member_LastName || '',
    spouseFirst: f.member_SpouseName || '',
    spouseLast: f.member_SpouseLastName || '',
    spouseEmail: f.member_SpouseEmailAddress || '',
    spouseMobile: f.member_SpouseMobilePhone || '',
    email: f.member_EmailAddress || '',
    cell: f.member_CellPhone || '',
    home: f.member_HomePhone || '',
    address: f.member_Address1 || '',
    city: f.member_City || '',
    state: f.member_State || '',
    zip: f.member_Zip || '',
    village: f.member_Village || '',
    spouseVillage: f.member_SpouseVillage || '',
    status: f['Current Status'] || '',
    isLifeMember: f['Life Member?'] === 'Yes',
    membershipCode: f['Membership Code'] || '',
    gender: f.gender || '',
    uniqId: f['UNIQ ID'] || '',
    profileUrl: f.url || '',
    paymentHistory: f['Payment History from archive DB'] || [],
  };
}

function statusClass(m) {
  const s = m.status.toLowerCase();
  if (m.isLifeMember && (s.includes('active') || s.includes('voting'))) return 'status-life';
  if (s.includes('annual dues') || (s.includes('active') && !s.includes('non'))) return 'status-active';
  return '';
}

function badgeHTML(m) {
  const s = m.status;
  if (s.includes('Life Member - Active')) return `<span class="status-badge badge-life">Life · Active</span>`;
  if (s.includes('Life Member - Voting')) return `<span class="status-badge badge-voting">Life · Voting</span>`;
  if (s.includes('Annual Dues')) return `<span class="status-badge badge-active">Annual Dues</span>`;
  if (s.includes('NON ACTIVE')) return `<span class="status-badge badge-inactive">Non-Active</span>`;
  return `<span class="status-badge badge-inactive">${s || 'Unknown'}</span>`;
}

function avatarClass(m) {
  if (m.isLifeMember && m.status.toLowerCase().includes('active')) return 'life-member';
  if (m.status.toLowerCase().includes('non active') || m.status.toLowerCase().includes('non-active')) return 'inactive';
  return '';
}

function initials(m) {
  return ((m.firstName[0] || '') + (m.lastName[0] || '')).toUpperCase();
}

function renderGrid(members) {
  const grid = document.getElementById('grid');
  document.getElementById('count-shown').textContent = members.length;

  if (!members.length) {
    grid.innerHTML = `<div class="no-results">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <p>No members match your search.</p>
    </div>`;
    return;
  }

  grid.innerHTML = members.map(m => `
    <div class="card ${statusClass(m)}" onclick="openModal('${m.id}')">
      <div class="card-header">
        <div class="avatar ${avatarClass(m)}">${initials(m)}</div>
        <div class="card-name">
          <h3>${m.firstName} ${m.lastName}</h3>
          ${m.spouseFirst ? `<div class="spouse">& ${m.spouseFirst} ${m.spouseLast}</div>` : ''}
        </div>
        ${badgeHTML(m)}
      </div>
      <div class="card-info">
        ${m.city ? `<div class="info-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          ${m.city}${m.state ? ', ' + m.state : ''}
        </div>` : ''}
        ${m.cell ? `<div class="info-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="20" x="5" y="2" rx="2"/><path d="M12 18h.01"/></svg>
          ${m.cell}
        </div>` : (m.home ? `<div class="info-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.4 2 2 0 0 1 3.6 1.22h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.56a16 16 0 0 0 6 6l.96-.96a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          ${m.home}
        </div>` : '')}
        ${m.email ? `<div class="info-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px">${m.email}</span>
        </div>` : ''}
      </div>
      <div class="card-footer">
        ${m.village ? `<span class="village-tag">${m.village}</span>` : '<span></span>'}
        <span class="member-id">#${m.uniqId ? m.uniqId.replace(/_/g,' ').trim() : m.id.slice(-6)}</span>
      </div>
    </div>
  `).join('');
}

function updateStats() {
  const active = allMembers.filter(m => !m.status.toLowerCase().includes('non') && m.status !== '' && !m.isLifeMember).length;
  const life = allMembers.filter(m => m.isLifeMember).length;
  const inactive = allMembers.filter(m => m.status.toLowerCase().includes('non active')).length;
  document.getElementById('count-active').textContent = active;
  document.getElementById('count-life').textContent = life;
  document.getElementById('count-inactive').textContent = inactive;
}

function filterMembers() {
  const q = document.getElementById('search').value.toLowerCase();
  const sf = document.getElementById('status-filter').value;

  filtered = allMembers.filter(m => {
    const matchQ = !q || [m.firstName, m.lastName, m.city, m.village, m.email, m.cell, m.spouseFirst, m.spouseLast]
      .join(' ').toLowerCase().includes(q);

    let matchS = true;
    if (sf === 'active') matchS = m.status.includes('Active') && !m.status.includes('Life');
    if (sf === 'life') matchS = m.isLifeMember;
    if (sf === 'annual') matchS = m.status.includes('Annual Dues');
    if (sf === 'inactive') matchS = m.status.includes('NON ACTIVE');

    return matchQ && matchS;
  });

  renderGrid(filtered);
}

function openModal(id) {
  const m = allMembers.find(x => x.id === id);
  if (!m) return;

  const lastPayment = m.paymentHistory.length
    ? m.paymentHistory[m.paymentHistory.length - 1]
    : null;

  document.getElementById('modal-content').innerHTML = `
    <div class="modal-header">
      <div class="modal-avatar ${avatarClass(m)}">${initials(m)}</div>
      <div class="modal-name">
        <h2>${m.firstName} ${m.lastName}</h2>
        ${m.spouseFirst ? `<div class="modal-spouse">Spouse: ${m.spouseFirst} ${m.spouseLast}</div>` : ''}
        <div style="margin-top:6px">${badgeHTML(m)}</div>
      </div>
    </div>

    <div class="modal-section">
      <h4>Contact</h4>
      <div class="detail-grid">
        ${m.cell ? `<div class="detail-item"><label>Cell</label><span>${m.cell}</span></div>` : ''}
        ${m.home ? `<div class="detail-item"><label>Home</label><span>${m.home}</span></div>` : ''}
        ${m.email ? `<div class="detail-item" style="grid-column:1/-1"><label>Email</label><span><a href="mailto:${m.email}">${m.email}</a></span></div>` : ''}
        ${m.spouseMobile ? `<div class="detail-item"><label>Spouse Mobile</label><span>${m.spouseMobile}</span></div>` : ''}
        ${m.spouseEmail ? `<div class="detail-item"><label>Spouse Email</label><span><a href="mailto:${m.spouseEmail}">${m.spouseEmail}</a></span></div>` : ''}
      </div>
    </div>

    <div class="modal-section">
      <h4>Address</h4>
      <div class="detail-grid">
        ${m.address ? `<div class="detail-item" style="grid-column:1/-1"><label>Street</label><span>${m.address}</span></div>` : ''}
        ${m.city ? `<div class="detail-item"><label>City</label><span>${m.city}</span></div>` : ''}
        ${m.state ? `<div class="detail-item"><label>State</label><span>${m.state} ${m.zip || ''}</span></div>` : ''}
      </div>
    </div>

    <div class="modal-section">
      <h4>Membership</h4>
      <div class="detail-grid">
        <div class="detail-item"><label>Status</label><span>${m.status}</span></div>
        <div class="detail-item"><label>Life Member</label><span>${m.isLifeMember ? 'Yes' : 'No'}</span></div>
        ${m.village ? `<div class="detail-item"><label>Village</label><span>${m.village}</span></div>` : ''}
        ${m.spouseVillage ? `<div class="detail-item"><label>Spouse Village</label><span>${m.spouseVillage}</span></div>` : ''}
        ${m.membershipCode ? `<div class="detail-item"><label>Code</label><span>${m.membershipCode}</span></div>` : ''}
        ${lastPayment ? `<div class="detail-item"><label>Last Payment</label><span>${lastPayment}</span></div>` : ''}
        ${m.paymentHistory.length ? `<div class="detail-item"><label>Payment Count</label><span>${m.paymentHistory.length} entries</span></div>` : ''}
      </div>
    </div>

    ${m.profileUrl ? `<div style="margin-top:8px"><a href="${m.profileUrl}" target="_blank" style="font-size:13px">View full profile →</a></div>` : ''}
  `;

  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(e) {
  if (e.target === document.getElementById('modal-overlay')) {
    document.getElementById('modal-overlay').classList.remove('open');
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('modal-overlay').classList.remove('open');
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    document.getElementById('search').focus();
  }
});
