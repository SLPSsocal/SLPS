<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLPS Community Directory</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --saffron: #E8871A;
    --saffron-light: #F5A94B;
    --deep: #1A1410;
    --card-bg: #FDFAF6;
    --border: #E8DDD0;
    --muted: #8C7B6B;
    --active: #2A6B3C;
    --inactive: #9E9E9E;
    --life: #7B3FA0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #F5EFE6;
    font-family: 'DM Sans', sans-serif;
    color: var(--deep);
    min-height: 100vh;
  }

  header {
    background: var(--deep);
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 20px rgba(0,0,0,0.3);
  }

  .header-top { display: flex; align-items: center; gap: 12px; }

  .logo-mark {
    width: 40px; height: 40px;
    background: var(--saffron);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Playfair Display', serif;
    font-weight: 700; color: white; font-size: 18px; flex-shrink: 0;
  }

  .header-text h1 {
    font-family: 'Playfair Display', serif;
    color: white; font-size: 17px; font-weight: 700; line-height: 1.1;
  }

  .header-text p {
    color: rgba(255,255,255,0.5); font-size: 10px;
    letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px;
  }

  .header-controls { display: flex; gap: 8px; width: 100%; }

  .header-controls input {
    flex: 1; min-width: 0;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px; padding: 10px 14px;
    color: white; font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none;
  }

  .header-controls input::placeholder { color: rgba(255,255,255,0.35); }
  .header-controls input:focus { border-color: var(--saffron); }

  .header-controls select {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px; padding: 10px;
    color: white; font-family: 'DM Sans', sans-serif; font-size: 13px;
    outline: none; cursor: pointer; flex-shrink: 0; max-width: 140px;
  }

  .header-controls select option { background: #2a2218; color: white; }

  .stats-bar {
    background: white; border-bottom: 1px solid var(--border);
    padding: 10px 16px; display: flex; align-items: stretch;
    font-size: 11px; color: var(--muted);
    overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .stats-bar::-webkit-scrollbar { display: none; }

  .stat {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 4px 10px; border-right: 1px solid var(--border); flex-shrink: 0;
  }
  .stat:last-child { border-right: none; margin-left: auto; padding-left: 16px; }
  .stat:not(:last-child) { cursor: pointer; transition: background 0.15s; border-radius: 6px; }
  .stat:not(:last-child):hover { background: #F5EFE6; }
  .stat.active-filter { background: var(--deep) !important; }
  .stat.active-filter strong, .stat.active-filter .stat-label { color: white !important; }
  .stat strong { color: var(--deep); font-weight: 600; font-size: 14px; line-height: 1; }
  .stat-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.04em; }
  .stat-top { display: flex; align-items: center; gap: 4px; }

  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

  main { padding: 16px; max-width: 1600px; margin: 0 auto; }

  #loading { text-align: center; padding: 60px 0; color: var(--muted); font-size: 15px; }

  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border); border-top-color: var(--saffron);
    border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #error-msg {
    display: none; background: #fff0f0; border: 1px solid #ffcccc;
    border-radius: 10px; padding: 16px 20px; margin: 20px 0;
    color: #c0392b; font-size: 14px; line-height: 1.6;
  }

  #grid { display: grid; grid-template-columns: 1fr; gap: 12px; }

  /* CARD */
  .card {
    background: var(--card-bg);
    border-radius: 14px; border: 1px solid var(--border);
    padding: 16px 18px; cursor: pointer;
    transition: all 0.2s; position: relative; overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  .card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0;
    height: 3px; background: var(--border);
  }
  .card.status-life::before { background: var(--life); }
  .card.status-annual::before { background: var(--saffron); }

  @media (hover: hover) {
    .card:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,0.12); border-color: var(--saffron-light); }
  }
  .card:active { opacity: 0.85; }

  .card-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; }

  .avatar {
    width: 42px; height: 42px; border-radius: 10px; background: var(--saffron);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Playfair Display', serif; font-weight: 700; color: white; font-size: 16px; flex-shrink: 0;
  }
  .avatar.life-active { background: var(--life); }
  .avatar.life-voting { background: #2255A4; }
  .avatar.inactive { background: #C5BAB0; }

  .card-name { flex: 1; min-width: 0; }
  .card-name h3 { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 15px; line-height: 1.2; }
  .card-name .spouse { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .status-badge {
    font-size: 9px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase;
    padding: 3px 7px; border-radius: 20px; flex-shrink: 0; margin-top: 2px; white-space: nowrap;
  }
  .badge-life   { background: #F3EAF9; color: var(--life); }
  .badge-voting { background: #EAF0F9; color: #2255A4; }
  .badge-annual { background: #FEF3E7; color: var(--saffron); }
  .badge-inactive { background: #F2F2F2; color: var(--inactive); }
  .badge-youth  { background: #FFF0F5; color: #C0397A; }

  .card-info { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); }
  .info-row { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .info-row svg { width: 12px; height: 12px; flex-shrink: 0; opacity: 0.55; }
  .info-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .card-footer {
    margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .village-tag {
    background: rgba(232,135,26,0.1); color: var(--saffron);
    padding: 2px 8px; border-radius: 6px; font-weight: 500; font-size: 11px;
    max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .member-id { font-size: 10px; opacity: 0.4; font-family: monospace; }

  /* UPDATE INFO BUTTON ON CARD */
  .update-info-btn {
    display: block;
    width: 100%;
    margin-top: 12px;
    padding: 9px 0;
    background: #F3EAF9;
    color: var(--life);
    border: none;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .update-info-btn:hover { background: #E8D5F5; text-decoration: none; }

  /* MODAL */
  #modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(26,20,16,0.7); z-index: 200;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    align-items: flex-end; justify-content: center; padding: 0;
  }
  #modal-overlay.open { display: flex; }

  #modal {
    background: var(--card-bg); border-radius: 20px 20px 0 0;
    width: 100%; max-height: 88vh; overflow-y: auto;
    -webkit-overflow-scrolling: touch; padding: 20px 20px 40px; position: relative;
  }

  .modal-drag-handle {
    width: 40px; height: 4px; background: var(--border);
    border-radius: 2px; margin: 0 auto 16px;
  }

  #modal-close {
    position: absolute; top: 16px; right: 16px;
    background: var(--border); border: none; border-radius: 8px;
    width: 32px; height: 32px; cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); -webkit-tap-highlight-color: transparent;
  }

  .modal-header { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 20px; padding-right: 40px; }

  .modal-avatar {
    width: 56px; height: 56px; border-radius: 14px; background: var(--saffron);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Playfair Display', serif; font-weight: 700; color: white; font-size: 22px; flex-shrink: 0;
  }
  .modal-avatar.life-active { background: var(--life); }
  .modal-avatar.life-voting { background: #2255A4; }
  .modal-avatar.inactive { background: #C5BAB0; }

  .modal-name h2 { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; line-height: 1.2; }
  .modal-name .modal-spouse { font-size: 13px; color: var(--muted); margin-top: 3px; }

  .modal-section { margin-bottom: 18px; }
  .modal-section h4 {
    font-size: 9px; font-weight: 500; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--saffron); margin-bottom: 10px;
  }

  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .detail-item label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); display: block; margin-bottom: 2px; }
  .detail-item span { font-size: 13px; color: var(--deep); word-break: break-word; }

  .modal-action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }

  .modal-action-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 12px; border-radius: 10px; font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 500; text-decoration: none;
    border: none; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .btn-call    { background: #E8F5EC; color: var(--active); }
  .btn-email   { background: #FEF3E7; color: var(--saffron); }
  .btn-admin   { background: #EAF0F9; color: #2255A4; grid-column: 1/-1; }

  a { color: var(--saffron); text-decoration: none; }

  .no-results { text-align: center; padding: 60px 20px; color: var(--muted); grid-column: 1 / -1; }
  .no-results p { font-size: 14px; margin-top: 8px; }

  @media (min-width: 600px) {
    header { padding: 20px 28px; }
    .logo-mark { width: 44px; height: 44px; font-size: 19px; }
    .header-text h1 { font-size: 19px; }
    main { padding: 24px 28px; }
    #grid { grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .stats-bar { padding: 10px 28px; }
    #modal { border-radius: 20px; max-width: 520px; max-height: 85vh; margin: auto; padding: 28px; }
    #modal-overlay { align-items: center; padding: 20px; }
    .modal-drag-handle { display: none; }
  }

  @media (min-width: 960px) {
    header { flex-direction: row; align-items: center; padding: 20px 40px; gap: 20px; }
    .header-top { flex: 0 0 auto; }
    .header-text h1 { font-size: 21px; }
    .header-controls { margin-left: auto; width: auto; }
    .header-controls input { width: 240px; flex: none; }
    .header-controls select { max-width: 160px; }
    .stats-bar { padding: 10px 40px; }
    .stat { flex-direction: row; gap: 6px; padding: 4px 16px; }
    .stat strong { font-size: 13px; }
    .stat-label { font-size: 12px; }
    main { padding: 28px 40px; }
    #grid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="logo-mark">S</div>
    <div class="header-text">
      <h1>Surti Leva Patidar Samaj</h1>
      <p>Southern California — Member Directory</p>
    </div>
  </div>
  <div class="header-controls">
    <input type="search" id="search" placeholder="Search name, city, village…" oninput="filterMembers()" autocomplete="off" spellcheck="false">
    <select id="status-filter" onchange="filterMembers()">
      <option value="">All Members</option>
      <option value="Life Member - Active">Life · Active</option>
      <option value="Life Member - Voting">Life · Voting</option>
      <option value="Annual Dues Member Only">Annual Dues</option>
      <option value="NON ACTIVE">Non-Active</option>
      <option value="Life Member - Youth">Youth</option>
      <option value="NON ACTIVE : Deceased">Deceased</option>
      <option value="zBusiness">Business</option>
    </select>
  </div>
</header>

<div class="stats-bar">
  <div class="stat active-filter" onclick="setStatFilter('')">
    <div class="stat-top"><strong id="count-all">–</strong></div>
    <span class="stat-label">All</span>
  </div>
  <div class="stat" onclick="setStatFilter('Life Member - Active')">
    <div class="stat-top"><span class="dot" style="background:#2A6B3C"></span><strong id="count-life-active">–</strong></div>
    <span class="stat-label">Life · Active</span>
  </div>
  <div class="stat" onclick="setStatFilter('Life Member - Voting')">
    <div class="stat-top"><span class="dot" style="background:#2255A4"></span><strong id="count-life-voting">–</strong></div>
    <span class="stat-label">Life · Voting</span>
  </div>
  <div class="stat" onclick="setStatFilter('Annual Dues Member Only')">
    <div class="stat-top"><span class="dot" style="background:#E8871A"></span><strong id="count-annual">–</strong></div>
    <span class="stat-label">Annual Dues</span>
  </div>
  <div class="stat" onclick="setStatFilter('NON ACTIVE')">
    <div class="stat-top"><span class="dot" style="background:#9E9E9E"></span><strong id="count-inactive">–</strong></div>
    <span class="stat-label">Non-Active</span>
  </div>
  <div class="stat" onclick="setStatFilter('Life Member - Youth')">
    <div class="stat-top"><span class="dot" style="background:#C0397A"></span><strong id="count-youth">–</strong></div>
    <span class="stat-label">Youth</span>
  </div>
  <div class="stat" onclick="setStatFilter('NON ACTIVE : Deceased')">
    <div class="stat-top"><span class="dot" style="background:#C0392B"></span><strong id="count-deceased">–</strong></div>
    <span class="stat-label">Deceased</span>
  </div>
  <div class="stat" onclick="setStatFilter('zBusiness')">
    <div class="stat-top"><span class="dot" style="background:#B0B0B0"></span><strong id="count-business">–</strong></div>
    <span class="stat-label">Business</span>
  </div>
  <div class="stat" style="margin-left:auto;border-right:none;"><strong id="count-shown">–</strong><span class="stat-label">Showing</span></div>
</div>

<main>
  <div id="loading"><div class="spinner"></div>Loading members…</div>
  <div id="error-msg"></div>
  <div id="grid"></div>
</main>

<div id="modal-overlay" onclick="closeModal(event)">
  <div id="modal">
    <div class="modal-drag-handle"></div>
    <button id="modal-close" onclick="document.getElementById('modal-overlay').classList.remove('open')">✕</button>
    <div id="modal-content"></div>
  </div>
</div>

<script>
let allMembers = [];
let filtered = [];

const AIRTABLE_PAT = 'pat5wEycSpIBV2v9v.762c93702e0299de23094f169f6d3d2213d5c862bdbb793352044f7e7911be7b';
const BASE_ID = 'appts3pknGCDwe6bk';
const TABLE_ID = 'tblvbEMVk7zr24B2c';
const VIEW_ID = 'viwNrRzG9funeJggp';

async function loadMembers() {
  try {
    let allRecords = [];
    let offset = null;
    do {
      const url = new URL(`https://api.airtable.com/v0/${BASE_ID}/${TABLE_ID}`);
      url.searchParams.set('view', VIEW_ID);
      url.searchParams.set('pageSize', '100');
      if (offset) url.searchParams.set('offset', offset);
      const res = await fetch(url.toString(), {
        headers: { 'Authorization': `Bearer ${AIRTABLE_PAT}` }
      });
      if (!res.ok) throw new Error(`Airtable error ${res.status}: ${await res.text()}`);
      const data = await res.json();
      allRecords = allRecords.concat(data.records || []);
      offset = data.offset || null;
    } while (offset);

    allMembers = allRecords.map(parseRecord).filter(m => m.firstName);
    updateStats();
    filtered = [...allMembers];
    renderGrid(filtered);
    document.getElementById('loading').style.display = 'none';
  } catch(e) {
    document.getElementById('loading').style.display = 'none';
    const err = document.getElementById('error-msg');
    err.style.display = 'block';
    err.innerHTML = `<strong>Could not load members.</strong><br>${e.message}`;
  }
}

function parseRecord(rec) {
  const f = rec.fields || {};
  return {
    id: rec.id,
    firstName: f.member_FirstName || '',
    lastName: f.member_LastName || '',
    spouseFirst: f.member_SpouseName || '',
    spouseLast: f.member_SpouseLastName || '',
    spouseEmail: f.member_SpouseEmailAddress || '',
    spouseMobile: f.member_SpouseMobilePhone || '',
    email: f.member_EmailAddress || '',
    cell: f.member_CellPhone || '',
    home: f.member_HomePhone || '',
    address: f.member_Address1 || '',
    city: f.member_City || '',
    state: f.member_State || '',
    zip: f.member_Zip || '',
    village: f.member_Village || '',
    spouseVillage: f.member_SpouseVillage || '',
    status: f['Current Status'] || '',
    isLifeMember: f['Life Member?'] === 'Yes',
    membershipCode: f['Membership Code'] || '',
    uniqId: f['UNIQ ID'] || '',
    paymentHistory: f['Payment History from archive DB'] || [],
    airtableUrl: `https://airtable.com/appts3pknGCDwe6bk/tblvbEMVk7zr24B2c/viwNrRzG9funeJggp/${rec.id}?blocks=hide`,
  };
}

function avatarClass(m) {
  if (m.status === 'Life Member - Active') return 'life-active';
  if (m.status === 'Life Member - Voting') return 'life-voting';
  if (m.status.includes('NON ACTIVE')) return 'inactive';
  return '';
}

function statusClass(m) {
  if (m.status === 'Life Member - Active' || m.status === 'Life Member - Voting') return 'status-life';
  if (m.status === 'Annual Dues Member Only') return 'status-annual';
  return '';
}

function badgeHTML(m) {
  const s = m.status;
  if (s === 'Life Member - Active')   return `<span class="status-badge badge-life">Life · Active</span>`;
  if (s === 'Life Member - Voting')   return `<span class="status-badge badge-voting">Life · Voting</span>`;
  if (s === 'Life Member - Youth')    return `<span class="status-badge badge-youth">Life · Youth</span>`;
  if (s === 'Annual Dues Member Only')return `<span class="status-badge badge-annual">Annual Dues</span>`;
  if (s === 'NON ACTIVE : Deceased')  return `<span class="status-badge badge-inactive">Deceased</span>`;
  if (s === 'NON ACTIVE')             return `<span class="status-badge badge-inactive">Non-Active</span>`;
  if (s === 'zBusiness')              return `<span class="status-badge badge-inactive">Business</span>`;
  return `<span class="status-badge badge-inactive">${s || 'Unknown'}</span>`;
}

function initials(m) {
  return ((m.firstName[0] || '') + (m.lastName[0] || '')).toUpperCase();
}

function updateInfoHref(m) {
  const subject = encodeURIComponent('Update Request: ' + m.firstName + ' ' + m.lastName);
  const body = encodeURIComponent('Hello,\n\nI would like to request the following changes for ' + m.firstName + ' ' + m.lastName + ':\n\n(Please describe the changes needed)\n\nThank you');
  return 'mailto:slps.socal@gmail.com?subject=' + subject + '&body=' + body;
}

function renderGrid(members) {
  const grid = document.getElementById('grid');
  document.getElementById('count-shown').textContent = members.length;

  if (!members.length) {
    grid.innerHTML = `<div class="no-results">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <p>No members match your search.</p>
    </div>`;
    return;
  }

  grid.innerHTML = members.map(m => {
    return `
    <div class="card ${statusClass(m)}" onclick="openModal('${m.id}')">
      <div class="card-header">
        <div class="avatar ${avatarClass(m)}">${initials(m)}</div>
        <div class="card-name">
          <h3>${m.firstName} ${m.lastName}</h3>
          ${m.spouseFirst ? `<div class="spouse">& ${m.spouseFirst}${m.spouseLast ? ' ' + m.spouseLast : ''}</div>` : ''}
        </div>
        ${badgeHTML(m)}
      </div>
      <div class="card-info">
        ${m.city ? `<div class="info-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg><span>${m.city}${m.state ? ', ' + m.state : ''}</span></div>` : ''}
        ${m.cell ? `<div class="info-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="20" x="5" y="2" rx="2"/><path d="M12 18h.01"/></svg><span>${m.cell}</span></div>` : (m.home ? `<div class="info-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.4 2 2 0 0 1 3.6 1.22h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.56a16 16 0 0 0 6 6l.96-.96a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg><span>${m.home}</span></div>` : '')}
        ${m.email ? `<div class="info-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg><span>${m.email}</span></div>` : ''}
      </div>
      <div class="card-footer">
        ${m.village ? `<span class="village-tag">${m.village}</span>` : '<span></span>'}
        <span class="member-id">#${m.uniqId ? m.uniqId.replace(/_+/g,' ').trim().split(' ').slice(0,2).join(' ') : m.id.slice(-6)}</span>
      </div>
    </div>`;
  }).join('');
}

function updateStats() {
  const count = val => allMembers.filter(m => m.status === val).length;
  document.getElementById('count-all').textContent = allMembers.length;
  document.getElementById('count-life-active').textContent = count('Life Member - Active');
  document.getElementById('count-life-voting').textContent  = count('Life Member - Voting');
  document.getElementById('count-annual').textContent       = count('Annual Dues Member Only');
  document.getElementById('count-inactive').textContent     = count('NON ACTIVE');
  document.getElementById('count-youth').textContent        = count('Life Member - Youth');
  document.getElementById('count-deceased').textContent     = count('NON ACTIVE : Deceased');
  document.getElementById('count-business').textContent     = count('zBusiness');
}

function setStatFilter(val) {
  document.getElementById('status-filter').value = val;
  document.querySelectorAll('.stats-bar .stat:not(:last-child)').forEach(el => el.classList.remove('active-filter'));
  const idx = ['', 'Life Member - Active', 'Life Member - Voting', 'Annual Dues Member Only', 'NON ACTIVE', 'Life Member - Youth', 'NON ACTIVE : Deceased', 'zBusiness'].indexOf(val);
  if (idx >= 0) document.querySelectorAll('.stats-bar .stat:not(:last-child)')[idx].classList.add('active-filter');
  filterMembers();
}

function filterMembers() {
  const q  = document.getElementById('search').value.toLowerCase();
  const sf = document.getElementById('status-filter').value;
  filtered = allMembers.filter(m => {
    const matchQ = !q || [m.firstName, m.lastName, m.city, m.village, m.email, m.cell, m.home, m.spouseFirst, m.spouseLast].join(' ').toLowerCase().includes(q);
    const matchS = !sf || m.status === sf;
    return matchQ && matchS;
  });
  renderGrid(filtered);
}

function openModal(id) {
  const m = allMembers.find(x => x.id === id);
  if (!m) return;
  const phone = m.cell || m.home || '';
  const lastPayment = m.paymentHistory.length ? m.paymentHistory[m.paymentHistory.length - 1] : null;

  document.getElementById('modal-content').innerHTML = `
    <div class="modal-header">
      <div class="modal-avatar ${avatarClass(m)}">${initials(m)}</div>
      <div class="modal-name">
        <h2>${m.firstName} ${m.lastName}</h2>
        ${m.spouseFirst ? `<div class="modal-spouse">& ${m.spouseFirst}${m.spouseLast ? ' ' + m.spouseLast : ''}</div>` : ''}
        <div style="margin-top:6px">${badgeHTML(m)}</div>
      </div>
    </div>

    <div class="modal-action-row">
      ${phone  ? `<a class="modal-action-btn btn-call"  href="tel:${phone.replace(/\D/g,'')}">📞 Call</a>` : '<span></span>'}
      ${m.email ? `<a class="modal-action-btn btn-email" href="mailto:${m.email}">✉️ Email</a>` : '<span></span>'}
      <a class="modal-action-btn" style="background:#F3EAF9;color:#7B3FA0;grid-column:1/-1;" href="${updateInfoHref(m)}">Update Info</a>
    </div>

    <div class="modal-section" style="margin-top:18px">
      <h4>Contact</h4>
      <div class="detail-grid">
        ${m.cell    ? `<div class="detail-item"><label>Cell</label><span>${m.cell}</span></div>` : ''}
        ${m.home    ? `<div class="detail-item"><label>Home</label><span>${m.home}</span></div>` : ''}
        ${m.email   ? `<div class="detail-item" style="grid-column:1/-1"><label>Email</label><span>${m.email}</span></div>` : ''}
        ${m.address ? `<div class="detail-item" style="grid-column:1/-1"><label>Street</label><span>${m.address}</span></div>` : ''}
        ${m.city    ? `<div class="detail-item"><label>City</label><span>${m.city}</span></div>` : ''}
        ${m.state   ? `<div class="detail-item"><label>State / ZIP</label><span>${m.state} ${m.zip || ''}</span></div>` : ''}
      </div>
    </div>

    ${(m.spouseFirst || m.spouseMobile || m.spouseEmail || m.spouseVillage) ? `
    <div class="modal-section">
      <h4>Spouse Info</h4>
      <div class="detail-grid">
        ${m.spouseFirst  ? `<div class="detail-item"><label>Name</label><span>${m.spouseFirst}${m.spouseLast ? ' ' + m.spouseLast : ''}</span></div>` : ''}
        ${m.spouseMobile ? `<div class="detail-item"><label>Mobile</label><span>${m.spouseMobile}</span></div>` : ''}
        ${m.spouseEmail  ? `<div class="detail-item" style="grid-column:1/-1"><label>Email</label><span>${m.spouseEmail}</span></div>` : ''}
        ${m.spouseVillage? `<div class="detail-item"><label>Village</label><span>${m.spouseVillage}</span></div>` : ''}
      </div>
    </div>` : ''}

    <div class="modal-section">
      <h4>Membership</h4>
      <div class="detail-grid">
        <div class="detail-item"><label>Status</label><span>${m.status}</span></div>
        <div class="detail-item"><label>Life Member</label><span>${m.isLifeMember ? 'Yes' : 'No'}</span></div>
        ${m.village        ? `<div class="detail-item"><label>Village</label><span>${m.village}</span></div>` : ''}
        ${m.membershipCode ? `<div class="detail-item"><label>Code</label><span>${m.membershipCode}</span></div>` : ''}
        ${lastPayment      ? `<div class="detail-item"><label>Last Payment</label><span>${lastPayment}</span></div>` : ''}
        ${m.paymentHistory.length ? `<div class="detail-item" style="grid-column:1/-1"><label>Payment History</label><span>${m.paymentHistory.join(', ')}</span></div>` : ''}
      </div>
    </div>

    <a class="modal-action-btn btn-admin" style="margin-top:8px;display:flex;" href="${m.airtableUrl}" target="_blank">Admin Edit</a>
  `;

  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('modal').scrollTop = 0;
}

function closeModal(e) {
  if (e.target === document.getElementById('modal-overlay')) {
    document.getElementById('modal-overlay').classList.remove('open');
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('modal-overlay').classList.remove('open');
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); document.getElementById('search').focus(); }
});

loadMembers();
</script>
</body>
</html>
